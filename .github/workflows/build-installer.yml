name: Build Windows Installer

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-installer:
    name: Build RootBrowser-Setup.exe
    runs-on: windows-2022

    steps:
      # ────────────────────────────────────────────────────────────────
      # 1. Checkout
      # ────────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ────────────────────────────────────────────────────────────────
      # 2. Setup Python (for aqtinstall)
      # ────────────────────────────────────────────────────────────────
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ────────────────────────────────────────────────────────────────
      # 3. Install aqtinstall (Qt installer)
      # ────────────────────────────────────────────────────────────────
      - name: Install aqtinstall
        run: |
          python -m pip install --upgrade pip
          python -m pip install aqtinstall

      # ────────────────────────────────────────────────────────────────
      # 4. Download & Install Qt 6.6 (MSVC 2019 64-bit)
      # ────────────────────────────────────────────────────────────────
      - name: Install Qt 6.6.0 (MSVC 2019 64-bit)
        run: |
          python -m aqt install-qt windows desktop 6.6.0 win64_msvc2019_64 `
            --outputdir C:\Qt `
            --archives qtbase qtwebengine qtsvg
        shell: pwsh

      # ────────────────────────────────────────────────────────────────
      # 5. Setup MSVC (Developer Command Prompt)
      # ────────────────────────────────────────────────────────────────
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # ────────────────────────────────────────────────────────────────
      # 6. Compile installer_windows.cpp
      # ────────────────────────────────────────────────────────────────
      - name: Compile installer
        shell: cmd
        run: |
          cl /nologo /std:c++17 /EHsc /O2 /MD /DNDEBUG ^
             installer_windows.cpp ^
             /Fe:RootBrowser-Setup.exe ^
             /I "C:\Qt\6.6.0\msvc2019_64\include" ^
             /I "C:\Qt\6.6.0\msvc2019_64\include\QtWidgets" ^
             /I "C:\Qt\6.6.0\msvc2019_64\include\QtGui" ^
             /I "C:\Qt\6.6.0\msvc2019_64\include\QtCore" ^
             /link /SUBSYSTEM:WINDOWS ^
             /LIBPATH:"C:\Qt\6.6.0\msvc2019_64\lib" ^
             Qt6Widgets.lib Qt6Gui.lib Qt6Core.lib ^
             user32.lib shell32.lib advapi32.lib

      # ────────────────────────────────────────────────────────────────
      # 7. Bundle Qt DLLs so .exe is standalone
      # ────────────────────────────────────────────────────────────────
      - name: Bundle Qt runtime DLLs
        shell: cmd
        run: |
          "C:\Qt\6.6.0\msvc2019_64\bin\windeployqt.exe" ^
             --release ^
             --no-translations ^
             --no-system-d3d-compiler ^
             --no-opengl-sw ^
             RootBrowser-Setup.exe

      # ────────────────────────────────────────────────────────────────
      # 8. Package into a zip (or keep standalone)
      # ────────────────────────────────────────────────────────────────
      - name: Prepare release folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item RootBrowser-Setup.exe release\
          # Copy all bundled Qt DLLs alongside
          Get-ChildItem -Filter "*.dll" | Copy-Item -Destination release\
          Get-ChildItem -Filter "*.pdb" -ErrorAction SilentlyContinue | Copy-Item -Destination release\
          # Copy platforms folder (required by Qt)
          if (Test-Path "platforms") { Copy-Item -Recurse platforms release\ }
          if (Test-Path "styles") { Copy-Item -Recurse styles release\ }
          if (Test-Path "imageformats") { Copy-Item -Recurse imageformats release\ }

      # ────────────────────────────────────────────────────────────────
      # 9. Upload artifact
      # ────────────────────────────────────────────────────────────────
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: RootBrowser-Setup-Windows
          path: release/
          retention-days: 30

      # ────────────────────────────────────────────────────────────────
      # 10. If tag pushed (v1.0.0), create GitHub Release
      # ────────────────────────────────────────────────────────────────
      - name: Package for release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          Compress-Archive -Path release\* -DestinationPath RootBrowser-Setup-Windows.zip -Force

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: RootBrowser-Setup-Windows.zip
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
